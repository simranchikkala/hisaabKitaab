<!DOCTYPE html>
<html>
  <head>
    <title>hisaabKitaab — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="setup.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
  </head>
  <body class="setup-body">
    <div class="auth-container">
      <div class="welcome-content">
        <div class="logo-mark">hK</div>
        <h1 class="welcome-title">Welcome back</h1>
        <p class="welcome-sub">Sign in to your hisaabKitaab account</p>

        <div id="authError" style="color:#EF4444;font-size:13px;display:none;width:100%;text-align:center"></div>

        <div class="setup-field" style="width:100%">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com">
        </div>

        <div class="setup-field" style="width:100%">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Your password">
        </div>

        <button class="setup-btn" onclick="signIn()">Sign In</button>

        <p style="font-size:13px;color:#6B7280">
          No account?
          <a href="signup.html" style="color:#FF8C42;font-weight:700">Sign up free</a>
        </p>
      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
